<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="has-sidebar">
    <!-- Sidebar Toggle -->
    <button id="toggle-btn" class="toggle-btn" aria-label="Toggle sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <a href="#" class="active"><i class="fas fa-home me-2"></i><span>Dashboard</span></a>
        <a href="#"><i class="fas fa-list-check me-2"></i><span>My Tasks</span></a>
        <a href="#"><i class="fas fa-calendar-alt me-2"></i><span>Calendar</span></a>
        <a href="#" id="dark-mode-toggle"><i class="fas fa-moon me-2"></i><span>Dark Mode</span></a>
        <a href="#"><i class="fas fa-gear me-2"></i><span>Settings</span></a>
    </div>

    <!-- Auth Guard (shown only briefly) -->
    <div id="auth-guard" class="text-center mt-5 pt-5">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-4 text-muted">Checking authentication...</p>
    </div>

    <!-- Main Content (Hidden until logged in) -->
    <div class="container mt-5 pt-4" id="main-content" style="display:none;">
        <div id="task-section">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-dark mb-0">Your Tasks</h2>
                <div>
                    <button id="add-task-btn" class="btn add-task-btn me-3"><i class="fas fa-plus me-2"></i>Add Task</button>
                    <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
                </div>
            </div>

            <!-- Dashboard Stats -->
            <div class="row mb-5 g-4">
                <div class="col-md-4">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-tasks fa-2x mb-2"></i>
                        <h6>Total Tasks</h6>
                        <p id="total-tasks" class="display-5 mb-0">0</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-check-circle fa-2x mb-2"></i>
                        <h6>Completed</h6>
                        <p id="completed-tasks" class="display-5 mb-0">0</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-exclamation-circle fa-2x mb-2"></i>
                        <h6>Pending</h6>
                        <p id="pending-tasks" class="display-5 mb-0">0</p>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="card upcoming-card p-4 h-100">
                        <h6 class="mb-3"><i class="fas fa-clock me-2"></i>Upcoming Deadlines</h6>
                        <ul id="upcoming-list" class="list-unstyled mb-0"></ul>
                    </div>
                </div>
                <div class="col-lg-8">
                    <ul id="task-list" class="list-group"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div class="modal fade" id="task-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="task-description" class="form-control mb-3" placeholder="Task description" required>
                    <input type="date" id="task-due-date" class="form-control" placeholder="Due date">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="save-task-btn" class="btn btn-success">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
