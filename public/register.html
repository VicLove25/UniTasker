<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center mb-4">Create Your Account</h2>

        <div class="card p-4 shadow-sm" style="max-width: 500px; margin:auto;">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" id="firstName" class="form-control" placeholder="First Name">
                </div>
                <div class="col-md-6 mb-3">
                    <input type="text" id="lastName" class="form-control" placeholder="Last Name">
                </div>
            </div>

            <input type="email" id="email" class="form-control mb-3" placeholder="Email">

            <input type="text" id="username" class="form-control mb-3" placeholder="Username">

            <input type="password" id="password" class="form-control mb-3" placeholder="Password (min 6 chars)">

            <button id="register-btn" class="btn btn-success w-100">Create Account</button>

            <div class="text-center mt-3">
                <a href="index.html">Already have an account? Login here</a>
            </div>

            <div id="error-message" class="alert alert-danger mt-3" style="display:none;"></div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
