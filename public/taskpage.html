<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - UniTasker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light has-sidebar">

    <div id="sidebar" class="sidebar">
        <a href="index.html"><i class="fas fa-home me-2"></i> <span>Dashboard</span></a>
        <a href="taskpage.html" class="active-page" style="background: #3c6e47;"><i class="fas fa-list me-2"></i> <span>My Tasks</span></a>
        <a href="calendar.html"><i class="fas fa-calendar-alt me-2"></i> <span>Calendar</span></a>
        <a href="settings.html"><i class="fas fa-gear me-2"></i> <span>Settings</span></a>
    </div>

    <button id="toggle-btn" class="toggle-btn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <header class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h2 fw-bold">My Tasks</h1>
                        <p class="text-muted mb-0">Manage your assignments and deadlines</p>
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-1 shadow-sm">
                        <i class="bi bi-plus-lg"></i>
                        New Task
                    </button>
                </header>

                <ul class="nav nav-tabs mb-4">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">All Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">To Do</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Completed</a>
                    </li>
                </ul>

                <div class="card card-body mb-4 border-0 shadow-sm">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-auto">
                            <span class="fw-medium text-success"><i class="bi bi-filter"></i> Filter by Year:</span>
                        </div>
                        <div class="col-md-4">
                            <select class="form-select form-select-sm" id="year-filter">
                                <option value="All" selected>All Years</option>
                                <option value="[Freshman]">Freshman</option>
                                <option value="[Soph/Jr]">Sophomore / Junior</option>
                                <option value="[Senior]">Senior</option>
                                <option value="[Graduation]">Graduation</option>
                            </select>
                        </div>
                    </div>
                </div>

                <main class="list-group shadow-sm">
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </main>

            </div>
        </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addTaskForm">
                        <div class="mb-3">
                            <label for="task-desc-input" class="form-label">Task Description</label>
                            <input type="text" class="form-control" id="task-desc-input" placeholder="e.g., [Freshman] Buy books" required>
                        </div>
                        <div class="mb-3">
                            <label for="task-due-date" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="task-due-date">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-task-btn">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/taskpage.js"></script>
</body>
</html>
