<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - UniTasker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Sidebar - Visible by default on calendar page -->
    <div id="sidebar" class="sidebar">
        <a href="index.html"><i class="fas fa-home me-2"></i> <span>Dashboard</span></a>
        <a href="taskpage.html"><i class="fas fa-plus me-2"></i> <span>Add Task</span></a>
        <a href="calendar.html" class="active"><i class="fas fa-calendar-alt me-2"></i> <span>Calendar</span></a>
    </div>

    <!-- Toggle Button - Visible by default on calendar page -->
    <button id="toggle-btn" class="toggle-btn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <!-- === Header Section with Green Background === -->
                <div class="calendar-page-header mb-4 p-4 rounded" style="background: linear-gradient(135deg, #3c6e47, #7da57d); color: #fff;">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h1 class="h2 fw-bold mb-0">Calendar</h1>
                            <p class="mb-0" style="color: rgba(255,255,255,0.9);">View your tasks by date</p>
                        </div>
                        <button class="btn btn-light d-flex align-items-center gap-2 shadow-sm">
                            <i class="fas fa-plus"></i>
                            New Task
                        </button>
                    </div>
                </div>

                <!-- === Calendar === -->
                <div class="card p-4 shadow-sm">
                    <div id="calendar" class="card p-3 shadow-sm">
                        <!-- calendar.js will render here -->
                    </div>
                </div>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addTaskForm">
                        <div class="mb-3">
                            <label for="task-desc-input" class="form-label">Task Description</label>
                            <input type="text" class="form-control" id="task-desc-input" placeholder="e.g., [Freshman] Buy books" required>
                        </div>
                        <div class="mb-3">
                            <label for="task-due-date" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="task-due-date">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-task-btn">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Page scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/calendar-page.js"></script>
    <!-- App.js is NOT loaded here to avoid duplicate sidebar/auth logic -->
</body>
</html>
