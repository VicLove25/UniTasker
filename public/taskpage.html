<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - UniTasker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <header class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h2 fw-bold">My Tasks</h1>
                        <p class="text-muted mb-0">Manage your assignments and deadlines</p>
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-1">
                        <i class="bi bi-plus-lg"></i>
                        New Task
                    </button>
                </header>

                <ul class="nav nav-tabs mb-4">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">All Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-muted" href="#">To Do</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-muted" href="#">Completed</a>
                    </li>
                </ul>

                <div class="card card-body mb-4">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-auto">
                            <span class="fw-medium"><i class="bi bi-filter"></i> Filters:</span>
                        </div>
                        <div class="col-md">
                            <select class="form-select form-select-sm">
                                <option selected>All Courses</option>
                                <option value="1">Info Systems</option>
                                <option value="2">Databases</option>
                            </select>
                        </div>
                        <div class="col-md">
                            <select class="form-select form-select-sm">
                                <option selected>All Types</option>
                                <option value="1">Homework</option>
                                <option value="2">Project</option>
                            </select>
                        </div>
                        <div class="col-md">
                            <select class="form-select form-select-sm">
                                <option selected>All Priorities</option>
                                <option value="1">High</option>
                                <option value="2">Medium</option>
                                <option value="3">Low</option>
                            </select>
                        </div>
                    </div>
                </div>

                <main class="list-group">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <zn class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </main>

                <button id="logout-btn" class="btn btn-outline-danger w-100 mt-4">Logout</button>

            </div>
        </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addTaskForm">
                        <div class="mb-3">
                            <label for="task-desc-input" class="form-label">Task Description</label>
                            <input type="text" class="form-control" id="task-desc-input" placeholder="e.g., Study for Math Final" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-task-btn">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/taskpage.js"></script>
</body>

</html>
