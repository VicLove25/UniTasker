<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- Toggle Button – HIDDEN until logged in -->
    <button id="toggle-btn" class="toggle-btn" style="display:none;">
        <i class="fas fa-bars"></i>
    </button>
    <!-- Sidebar – HIDDEN until logged in -->
    <div id="sidebar" class="sidebar" style="display:none;">
        <a href="index.html"><i class="fas fa-home me-2"></i><span>Dashboard</span></a>
        <a href="taskpage.html" class="active"><i class="fas fa-list-check me-2"></i><span>My Tasks</span></a>
        <a href="calendar.html"><i class="fas fa-calendar-alt me-2"></i><span>Calendar</span></a>
        <a href="settings.html"><i class="fas fa-gear me-2"></i><span>Settings</span></a>
    </div>

    <!-- Main Content -->
    <div class="main-content container pt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-dark mb-1">My Tasks</h2>
                <p class="text-muted">All your tasks in one place</p>
            </div>
            <button id="add-task-btn" class="btn add-task-btn">
                <i class="fas fa-plus me-2"></i>New Task
            </button>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item"><a class="nav-link active" href="#">All Tasks</a></li>
            <li class="nav-item"><a class="nav-link" href="#">To Do</a></li>
            <li class="nav-item"><a class="nav-link" href="#">In Progress</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Completed</a></li>
        </ul>

        <!-- Filter Bar -->
        <div class="card card-body mb-4 border-0 shadow-sm">
            <div class="row g-3 align-items-center">
                <div class="col-auto"><strong>Filters:</strong></div>
                <div class="col-md-3"><select class="form-select form-select-sm"><option>All Courses</option></select></div>
                <div class="col-md-3"><select class="form-select form-select-sm"><option>All Types</option></select></div>
                <div class="col-md-3"><select class="form-select form-select-sm"><option>All Priorities</option></select></div>
            </div>
        </div>

        <div id="task-list" class="list-group"></div>

        <div id="empty-state" class="text-center py-5" style="display:none;">
            <i class="fas fa-clipboard-list fa-4x text-muted mb-3"></i>
            <h5 class="text-muted">No tasks yet</h5>
            <p class="text-muted">Click "New Task" to get started!</p>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="task-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="task-description" class="form-control mb-3" placeholder="Task description" required>
                    <input type="date" id="task-due-date" class="form-control">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="save-task-btn" class="btn btn-success">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggle-btn');

            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            // Show sidebar & toggle button
            sidebar.style.display = 'block';
            toggleBtn.style.display = 'block';

            // Restore collapsed state
            if (localStorage.getItem('sidebarCollapsed') === 'true') {
                sidebar.classList.add('collapsed');
                document.body.classList.add('sidebar-collapsed');
            }

            // Restore dark mode (this is the ONLY line added)
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }

            // Toggle sidebar
            toggleBtn.onclick = () => {
                sidebar.classList.toggle('collapsed');
                document.body.classList.toggle('sidebar-collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            };

            // Render tasks
            if (typeof renderTasks === 'function') renderTasks();
        });
    </script>
</body>
</html>
