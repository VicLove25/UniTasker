<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="bg-light">
    <div class="container mt-5 pt-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-success">TaskFlow</h1>
            <p class="text-muted">Welcome back! Please login to continue</p>
        </div>

        <div class="card border-0 shadow-lg p-5" style="max-width: 420px; margin: 0 auto;">
            <h2 class="mb-4 text-dark text-center">Login</h2>

            <input type="text" id="username" class="form-control form-control-lg mb-3" placeholder="Username" required autofocus>
            <input type="password" id="password" class="form-control form-control-lg mb-4" placeholder="Password" required>

            <button id="login-btn" class="btn btn-success btn-lg w-100 mb-3">Login</button>

            <p class="text-center text-muted">
                Don't have an account?
                <a href="register.html" class="fw-bold text-success text-decoration-none">Register here</a>
            </p>

            <div id="error-message" class="alert alert-danger mt-3" role="alert" style="display:none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
