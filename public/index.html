<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <button id="toggle-btn" class="toggle-btn" style="display:none;">
        <i class="fas fa-bars"></i>
    </button>

    <div id="sidebar" class="sidebar" style="display:none;">
        <a href="index.html" class="active"><i class="fas fa-home me-2"></i><span>Dashboard</span></a>
        <a href="taskpage.html"><i class="fas fa-list-check me-2"></i><span>My Tasks</span></a>
        <a href="calendar.html"><i class="fas fa-calendar-alt me-2"></i><span>Calendar</span></a>
        <a href="settings.html"><i class="fas fa-gear me-2"></i><span>Settings</span></a>
    </div>

    <div class="main-content">

        <div id="auth-section">
            <div class="container">
                <div class="row justify-content-center min-vh-100 align-items-center">
                    <div class="col-md-6 col-lg-5 col-xl-4">
                        <div class="card border-0 shadow-lg p-5">
                            <div class="text-center mb-5">
                                <h2 class="text-dark fw-bold">Welcome Back</h2>
                                <p class="text-muted">Log in to continue managing your tasks</p>
                            </div>

                            <input type="text" id="username" class="form-control form-control-lg mb-3" placeholder="Username" required>
                            <input type="password" id="password" class="form-control form-control-lg mb-4" placeholder="Password" required>

                            <button id="login-btn" class="btn btn-success btn-lg w-100 mb-4">
                                <span class="spinner-border spinner-border-sm me-2 d-none"></span>
                                Login
                            </button>

                            <div class="text-center">
                                <p class="text-muted mb-0">
                                    Don't have an account?
                                    <a href="register.html" class="text-success fw-bold text-decoration-none">Register here</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="task-section" style="display:none;" class="container pt-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="text-dark mb-1">Your Tasks</h2>
                    <p class="text-muted">Welcome back, <strong id="welcome-user">User</strong>!</p>
                </div>
                <div>
                    <button id="add-task-btn" class="btn add-task-btn me-3">
                        <i class="fas fa-plus me-2"></i>Add Task
                    </button>
                    <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
                </div>
            </div>

            <div class="row mb-5 g-4">
                <div class="col-md-4">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-tasks fa-2x mb-2"></i>
                        <h6>Total Tasks</h6>
                        <p id="total-tasks" class="display-5 mb-0">0</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-check-circle fa-2x mb-2"></i>
                        <h6>Completed</h6>
                        <p id="completed-tasks" class="display-5 mb-0">0</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-exclamation-circle fa-2x mb-2"></i>
                        <h6>Pending</h6>
                        <p id="pending-tasks" class="display-5 mb-0">0</p>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="card upcoming-card p-4 mb-4">
                        <h6 class="mb-3"><i class="fas fa-clock me-2"></i>Upcoming Deadlines</h6>
                        <ul id="upcoming-list" class="list-unstyled mb-0"></ul>
                    </div>
                    
                    <div class="card p-3 shadow-sm border-0">
                        <div id="calendar-dashboard"></div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <ul id="task-list" class="list-group"></ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="task-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="task-description" class="form-control mb-3" placeholder="Task description" required>
                    <input type="date" id="task-due-date" class="form-control">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="save-task-btn" class="btn btn-success">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
